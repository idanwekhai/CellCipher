provisional_selection:
  status: requires empirical all-by-all site and RDF crosstalk testing
  rationale:
    - complete native integrase and directionality-factor CDS provenance
    - exact literature-curated attachment sites
    - distinct phage origins and experimentally established forward chemistry
    - reverse chemistry has direct evidence for each channel
sensors:
  A:
    promoter: P_lac
    regulator: LacI
    inducer: IPTG
    assignment: Channel A
    evidence: established E. coli sensor and CRISPR-controller precedent
    constraints: lacI must be present; avoid glucose-mediated catabolite repression
  B:
    promoter: P_LtetO-1
    regulator: TetR
    inducer: aTc
    assignment: Channel B
    evidence: established orthogonal E. coli sensor
    constraints: tetR must be supplied; aTc is light sensitive
  C:
    promoter: P_BAD
    regulator: AraC
    inducer: L-arabinose
    assignment: Channel C
    evidence: established E. coli sensor
    constraints: delta_araBAD and optional constitutive araE improve homogeneity
sensor_selection_status: leading conventional set; exact promoter/operator sequences are unresolved placeholders
